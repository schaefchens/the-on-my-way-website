# Records video with the (virtual) camera for about 3 s x ${REC_WAITS}, trims it on the compose
# screen (the end handle dragged to the left: the clip keeps its first second or so), mutes it and
# shares it. Starts and ends on Today. Used by the end-to-end run. The caller passes REC_WAITS
# (runFlow env); a default here would win over the caller's value in Maestro 2.12.
appId: de.schaefchens.apps.onmyway
---
- tapOn:
    id: capture-button
- extendedWaitUntil:
    visible:
      id: camera-view
    timeout: 15000
- runFlow: allow-camera.yaml
- tapOn:
    id: mode-video
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: shutter
- extendedWaitUntil:
    visible:
      id: record-timer
    timeout: 10000
# The timer keeps the screen moving, so each wait runs its full 3 s.
- repeat:
    times: ${REC_WAITS}
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: shutter
- extendedWaitUntil:
    visible:
      id: compose-screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: trim-bar
    timeout: 10000
- assertVisible:
    id: trim-start
- assertVisible:
    id: trim-end
- swipe:
    from:
      id: trim-end
    direction: LEFT
    duration: 800
- tapOn:
    id: compose-mute
- tapOn:
    id: send-button
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: today-item-0
    timeout: 10000
