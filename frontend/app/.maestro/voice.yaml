# A voice note: tap the microphone to start, tap again to stop (the hands-free way), listen,
# share. The emulator's microphone records silence, which is fine for the flow.
appId: app.omw.traveler
name: Voice - record and share
tags:
  - main
---
- runFlow: subflows/fresh-start.yaml
- tapOn:
    id: capture-button
- extendedWaitUntil:
    visible:
      id: camera-screen
    timeout: 15000
- tapOn:
    id: mode-voice
- extendedWaitUntil:
    visible:
      id: voice-screen
    timeout: 10000
- tapOn:
    id: voice-mic
# (Maestro grants the microphone at launch; on a phone the system asks once here.)
- assertVisible:
    id: voice-time
# The live meter keeps the screen moving, so this waits the full 3 s (a few seconds of voice).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: voice-mic
- extendedWaitUntil:
    visible:
      id: voice-play
    timeout: 10000
- tapOn:
    id: send-button
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: today-item-0
    timeout: 10000
