# End-to-end run (scripts/app/e2e.sh), step 1: a fresh install pairs with the one-time code the
# owner created in the admin ("Connect a phone"). Local dev API only. -e CODE=ABCD-EFGH
appId: de.schaefchens.onmyway
name: e2e - pair with the admin's code
tags:
  - e2e
---
- runFlow: ../subflows/fresh-start.yaml
- tapOn:
    id: pair-open
- extendedWaitUntil:
    visible:
      id: pair-screen
    timeout: 10000
- tapOn:
    id: pair-code
- inputText: ${CODE}
- hideKeyboard
- tapOn:
    id: pair-connect
- extendedWaitUntil:
    visible:
      id: pair-done
    timeout: 30000
- takeScreenshot: e2e-01-paired
- tapOn:
    id: pair-start
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 10000
- assertNotVisible:
    id: pair-card
