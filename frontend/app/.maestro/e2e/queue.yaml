# End-to-end run: opens the queue sheet, waits for a status text (-e EXPECT=<regex>), takes a
# screenshot (-e SHOT=<name>) and closes it. Brings the app to the front without stopping it.
appId: de.schaefchens.onmyway
name: e2e - queue shows a status
tags:
  - e2e
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 60000
- tapOn:
    id: sync-pill
- extendedWaitUntil:
    visible:
      id: queue-sheet
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ${EXPECT}
    timeout: ${WAIT_MS}
- takeScreenshot: ${SHOT}
- tapOn:
    id: queue-sheet-close
