# End-to-end run: "Upload automatically" off, a new text status waits as "Ready to upload".
appId: de.schaefchens.onmyway
name: e2e - manual mode waits
tags:
  - e2e
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 60000
- tapOn:
    id: settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- assertVisible:
    id: setting-auto
    checked: true
- tapOn:
    id: setting-auto
- assertVisible:
    id: setting-auto
    checked: false
- tapOn:
    id: settings-back
- runFlow:
    file: ../subflows/text-steps.yaml
    env:
      TEXT: Waiting for my tap
- tapOn:
    id: sync-pill
- extendedWaitUntil:
    visible:
      text: Ready to upload
    timeout: 15000
- takeScreenshot: e2e-06-ready-to-upload
- tapOn:
    id: queue-sheet-close
