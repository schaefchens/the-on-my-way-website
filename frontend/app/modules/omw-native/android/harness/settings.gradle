// Standalone harness for omw-native: builds the module's Android sources WITHOUT React Native or
// Expo (the five Omw*Module.kt bridges are left out), so the JVM unit tests and the instrumented
// tests run fast, with small outputs, and independently of the app's generated android/ project.
// Run it through ./gradle.sh (it sets the toolchain and keeps every output in <repo>/.cache).
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = 'omw-native-harness'
include ':core'
